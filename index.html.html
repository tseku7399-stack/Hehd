function makeIcon(paths) {
  return function IconCmp({ size = 18, color = "currentColor", strokeWidth = 2, fill = "none" }) {
    return (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill={fill}
        stroke={color}
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
      >
        {paths}
      </svg>
    );
  };
}

function GameCard({ game, onClick }) {
  const [hover, setHover] = useState(false);
  const [imgFailed, setImgFailed] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        borderRadius: 16, overflow: "hidden", cursor: "pointer", position: "relative",
        border: `1px solid ${hover ? game.color : "rgba(255,255,255,0.08)"}`,
        transition: "all 0.2s ease", transform: hover ? "translateY(-4px)" : "translateY(0)",
        boxShadow: hover ? `0 12px 32px ${game.color}33` : "none",
      }}
    >
      <div style={{
        height: 96, background: game.banner, display: "flex", alignItems: "center", justifyContent: "center",
        position: "relative", overflow: "hidden"
      }}>
        {game.image && !imgFailed && (
          <img
            src={game.image}
            alt={game.name}
            onError={() => setImgFailed(true)}
            style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }}
          />
        )}
        <div style={{
          position: "absolute", inset: 0,
          background: game.image && !imgFailed ? "linear-gradient(0deg, rgba(0,0,0,0.45), rgba(0,0,0,0) 60%)" : "transparent"
        }} />
        {(!game.image || imgFailed) && (
          <div style={{
            position: "absolute", width: 110, height: 110, borderRadius: "50%",
            background: "radial-gradient(circle, rgba(255,255,255,0.22), transparent 70%)"
          }} />
        )}
        {game.popular && (
          <span style={{
            position: "absolute", top: 8, left: 8, background: "rgba(0,0,0,0.5)",
            color: "#fff", fontSize: 9, fontWeight: 700, padding: "3px 7px", borderRadius: 8,
            display: "flex", alignItems: "center", gap: 3, zIndex: 1
          }}>
            <TrendingUp size={9} /> ТРЕНД
          </span>
        )}
        {(!game.image || imgFailed) && (
          <div style={{ fontSize: 56, position: "relative", zIndex: 1, filter: "drop-shadow(0 4px 10px rgba(0,0,0,0.35))" }}>
            {game.icon}
          </div>
        )}
      </div>
      <div style={{ padding: "10px 12px", background: "#12162a" }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#EDEFF7", marginBottom: 2 }}>{game.name}</div>
        <div style={{ fontSize: 11, color: "#6C7189" }}>{game.currency} цэнэглэлт</div>
      </div>
    </div>
  );
}

// ---------- Player ID + Package screen ----------
function GameDetailScreen({ game, onCheckout }) {
  const [playerId, setPlayerId] = useState("");
  const [serverId, setServerId] = useState("");

  const [imgFailed, setImgFailed] = useState(false);
  const [checking, setChecking] = useState(false);
  const [checkedName, setCheckedName] = useState(null);
  const packages = PACKAGES[game.id] || defaultPackages(game.currency);

  const idReady = playerId.trim() && (!game.hasZoneId || serverId.trim());

  const handleIdChange = (setter) => (e) => {
    setter(e.target.value);
    setCheckedName(null);
  };

    if (!idReady || checking) return;
    setChecking(true);
    setCheckedName(null);
    setTimeout(() => {
      setChecking(false);
      setCheckedName(`Player_${playerId.trim().slice(-5)}`);

  return (

      }}>

        {game.bannerImage && !imgFailed && (
          <img
            src={game.bannerImage}
            alt={game.name}
            onError={() => setImgFailed(true)}
            style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }}
          />
        )}

          <div style={{
            position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 72, opacity: 0.9
          }}>
            {game.icon}
          </div>
        )}
        {/* Текст уншигдахуйц байлгах градиент давхарга */}
        <div style={{ position: "absolute", inset: 0, background: "linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0.05) 65%)" }} />
        <div style={{
          position: "relative", zIndex: 1, height: "100%",
          display: "flex", alignItems: "flex-end", padding: "0 22px 16px"
        }}>
          <div>
            <div style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 22, color: "#fff" }}>{game.name}</div>
            <div style={{ fontSize: 13, color: "rgba(255,255,255,0.85)" }}>{game.currency} шууд цэнэглэлт</div>

        </div>
      </div>

          <Check size={13} color="#0B0E1A" strokeWidth={3} />
        </div>
        <span style={{ fontSize: 13, color: "#EDEFF7", opacity: checkedName ? 1 : 0, transition: "opacity 0.15s ease" }}>
          Тоглогч олдлоо: <b>{checkedName || "—"}</b>
        </span>
      </div>

      {/* Packages */}
      <SectionLabel step="2" text={`${game.currency} багц сонгох`} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 28 }}>
        {packages.map((p) => (
          <PackageCard
            key={p.id}
            pkg={p}
            currency={game.currency}
            color={game.color}
            iconUrl={CURRENCY_ICONS[game.id]}
            iconSize={CURRENCY_ICON_SIZES[game.id]}
            selected={selectedPkg?.id === p.id}
            onClick={() => setSelectedPkg(p)}
          />
        ))}
      </div>

      {/* Sticky checkout bar */}
      <div style={{
        position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 20,
        background: "rgba(11,14,26,0.95)", backdropFilter: "blur(12px)",
        borderTop: "1px solid rgba(255,255,255,0.08)", padding: "14px 20px",
        display: "flex", alignItems: "center", justifyContent: "space-between", maxWidth: 900, margin: "0 auto"
      }}>
        <div>
          <div style={{ fontSize: 11, color: "#6C7189" }}>Нийт төлөх</div>
          <div style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 20, color: selectedPkg ? "#C6FF3D" : "#6C7189" }}>
            {selectedPkg ? fmt(selectedPkg.price) : "—"}
          </div>
        </div>
        <button
          disabled={!canBuy}
          onClick={() => onCheckout({ playerId, serverId, pkg: selectedPkg })}
          style={{
            padding: "13px 32px", borderRadius: 14, border: "none",
            background: canBuy ? "linear-gradient(90deg,#C6FF3D,#8FE62E)" : "rgba(255,255,255,0.08)",
            color: canBuy ? "#0B0E1A" : "#6C7189",
            fontWeight: 800, fontSize: 15, cursor: canBuy ? "pointer" : "not-allowed",
            fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.5,
            display: "flex", alignItems: "center", gap: 6
          }}
        >
          Худалдан авах <ChevronRight size={18} />
        </button>
      </div>
    </div>
  );
}

function SectionLabel({ step, text }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
      <div style={{
        width: 24, height: 24, borderRadius: "50%", background: "rgba(198,255,61,0.15)",
        border: "1px solid #C6FF3D", color: "#C6FF3D", fontSize: 12, fontWeight: 800,
        display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Rajdhani', sans-serif"
      }}>
        {step}
      </div>
      <span style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 16, color: "#EDEFF7", letterSpacing: 0.3 }}>
        {text}
      </span>
    </div>
  );
}

const inputStyle = {
  flex: 1, background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.12)",
  borderRadius: 12, padding: "13px 16px", color: "#EDEFF7", fontSize: 14, outline: "none",
  fontFamily: "inherit", boxSizing: "border-box", width: "100%"
};

const fieldLabelStyle = {
  display: "block", fontSize: 12.5, color: "#9BA0B8", marginBottom: 6,
  whiteSpace: "nowrap", overflow: "visible"
};

function PackageCard({ pkg, currency, color, iconUrl, iconSize, selected, onClick }) {
  const size = iconSize || 15;
  return (
    <div
      onClick={onClick}
      style={{
        borderRadius: 14, padding: "14px 14px 12px", cursor: "pointer", position: "relative",
        background: selected ? `${color}18` : "rgba(255,255,255,0.04)",
        border: selected ? `1.5px solid ${color}` : "1px solid rgba(255,255,255,0.1)",
        transition: "all 0.15s ease"
      }}
    >
      {(pkg.popular || pkg.best) && (
        <span style={{
          position: "absolute", top: -9, right: 10, fontSize: 9, fontWeight: 800,
          padding: "3px 8px", borderRadius: 8, letterSpacing: 0.3,
          background: pkg.best ? "linear-gradient(90deg,#C6FF3D,#8FE62E)" : "#7C4DFF",
          color: pkg.best ? "#0B0E1A" : "#fff"
        }}>
          {pkg.best ? "ХЯМД" : "ТҮГЭЭМЭЛ"}
        </span>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
        {iconUrl ? (
          <img
            src={iconUrl}
            alt=""
            style={{ width: size, height: size, objectFit: "contain", display: "block", background: "transparent" }}
          />
        ) : (
          <Gem size={15} color={color} />
        )}
        <span style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 17, color: "#EDEFF7" }}>
          {pkg.amount.toLocaleString()}
        </span>
        {pkg.bonus > 0 && (
          <span style={{ fontSize: 10, color: "#C6FF3D", fontWeight: 700 }}>+{pkg.bonus}</span>
        )}
      </div>
      <div style={{ fontSize: 12, color: "#6C7189", marginBottom: 8 }}>{currency}</div>
      <div style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 15, color: selected ? color : "#EDEFF7" }}>
        {fmt(pkg.price)}
      </div>
      {selected && (
        <div style={{
          position: "absolute", top: 10, right: 10, width: 18, height: 18, borderRadius: "50%",
          background: color, display: "flex", alignItems: "center", justifyContent: "center"
        }}>
          <Check size={11} color="#0B0E1A" strokeWidth={3} />
        </div>
      )}
    </div>
  );
}

// ---------- Checkout screen ----------
function CheckoutScreen({ order, game, onConfirm, onGoHome }) {
  const [method, setMethod] = useState("qpay");
  const [paid, setPaid] = useState(false);

  if (paid) {
    return (
      <div style={{ padding: "60px 24px", textAlign: "center" }}>
        <div style={{
          width: 84, height: 84, borderRadius: "50%", background: "rgba(198,255,61,0.15)",
          border: "2px solid #C6FF3D", display: "flex", alignItems: "center", justifyContent: "center",
          margin: "0 auto 24px"
        }}>
          <Check size={40} color="#C6FF3D" strokeWidth={3} />
        </div>
        <h2 style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 26, color: "#EDEFF7", margin: "0 0 10px" }}>
          Амжилттай цэнэглэгдлээ!
        </h2>
        <p style={{ color: "#9BA0B8", fontSize: 14, margin: "0 0 4px" }}>
          {order.pkg.amount.toLocaleString()} {game.currency} таны {game.name} акаунт руу орлоо.
        </p>
        <p style={{ color: "#6C7189", fontSize: 12, marginBottom: 28 }}>ID: {order.playerId} {order.serverId && `· Server: ${order.serverId}`}</p>
        <button
          onClick={onGoHome}
          style={{
            padding: "13px 32px", borderRadius: 14, border: "none",
            background: "linear-gradient(90deg,#C6FF3D,#8FE62E)", color: "#0B0E1A",
            fontWeight: 800, fontSize: 15, cursor: "pointer",
            fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.5,
            display: "inline-flex", alignItems: "center", gap: 6
          }}
        >
          Нүүр хуудас руу буцах <ChevronRight size={18} />
        </button>
      </div>
    );
  }

  return (
    <div style={{ padding: "20px 20px 100px" }}>
      <SectionLabel step="3" text="Захиалгын мэдээлэл" />
      <div style={{
        background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)",
        borderRadius: 14, padding: 16, marginBottom: 24
      }}>
        <Row label="Тоглоом" value={game.name} />
        <Row label="Player ID" value={order.playerId} />
        {order.serverId && <Row label="Server ID" value={order.serverId} />}
        <Row label="Багц" value={`${order.pkg.amount.toLocaleString()} ${game.currency}${order.pkg.bonus ? ` (+${order.pkg.bonus} бонус)` : ""}`} />
        <div style={{ borderTop: "1px solid rgba(255,255,255,0.1)", margin: "10px 0", paddingTop: 10 }}>
          <Row label="Нийт дүн" value={fmt(order.pkg.price)} big />
        </div>
      </div>

      <SectionLabel step="4" text="Төлбөрийн хэлбэр" />
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
        {PAYMENT_METHODS.map((m) => (
          <div
            key={m.id}
            onClick={() => setMethod(m.id)}
            style={{
              display: "flex", alignItems: "center", gap: 14, padding: "14px 16px", borderRadius: 14,
              cursor: "pointer", background: method === m.id ? "rgba(124,77,255,0.12)" : "rgba(255,255,255,0.04)",
              border: method === m.id ? "1.5px solid #7C4DFF" : "1px solid rgba(255,255,255,0.1)"
            }}
          >
            <div style={{
              width: 40, height: 40, borderRadius: 10, background: "rgba(255,255,255,0.06)",
              display: "flex", alignItems: "center", justifyContent: "center"
            }}>
              <m.icon size={18} color="#EDEFF7" />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: "#EDEFF7" }}>{m.name}</div>
              <div style={{ fontSize: 11, color: "#6C7189" }}>{m.desc}</div>
            </div>
            {method === m.id && (
              <div style={{
                width: 18, height: 18, borderRadius: "50%", background: "#7C4DFF",
                display: "flex", alignItems: "center", justifyContent: "center"
              }}>
                <Check size={11} color="#fff" strokeWidth={3} />
              </div>
            )}
          </div>
        ))}
      </div>

      <div style={{
        position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 20,
        background: "rgba(11,14,26,0.95)", backdropFilter: "blur(12px)",
        borderTop: "1px solid rgba(255,255,255,0.08)", padding: "14px 20px", maxWidth: 900, margin: "0 auto"
      }}>
        <button
          onClick={() => setPaid(true)}
          style={{
            width: "100%", padding: "15px 0", borderRadius: 14, border: "none",
            background: "linear-gradient(90deg,#C6FF3D,#8FE62E)", color: "#0B0E1A",
            fontWeight: 800, fontSize: 16, cursor: "pointer", fontFamily: "'Rajdhani', sans-serif",
            letterSpacing: 0.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 8
          }}
        >
          <Zap size={18} fill="#0B0E1A" /> {fmt(order.pkg.price)} төлөх
        </button>
      </div>
    </div>
  );
}

function Row({ label, value, big }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "5px 0" }}>
      <span style={{ fontSize: big ? 14 : 13, color: big ? "#EDEFF7" : "#9BA0B8", fontWeight: big ? 700 : 400 }}>{label}</span>
      <span style={{
        fontSize: big ? 18 : 13, color: big ? "#C6FF3D" : "#EDEFF7", fontWeight: big ? 800 : 600,
        fontFamily: big ? "'Rajdhani', sans-serif" : "inherit"
      }}>
        {value}
      </span>
    </div>
  );
}

// ---------- Auth modal ----------
function AuthModal({ onClose, onSuccess }) {
  const [mode, setMode] = useState("login"); // "login" | "register"
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [password, setPassword] = useState("");

  const canSubmit = mode === "login" ? phone.trim() && password.trim() : name.trim() && phone.trim() && password.trim();

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!canSubmit) return;
    onSuccess(mode === "login" ? phone.trim() : name.trim());
  };

  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, zIndex: 50, background: "rgba(5,6,12,0.7)",
        backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center",
        padding: 20
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          width: "100%", maxWidth: 380, background: "#12162a", borderRadius: 20,
          border: "1px solid rgba(255,255,255,0.1)", padding: 26, position: "relative",
          boxShadow: "0 20px 60px rgba(0,0,0,0.5)"
        }}
      >
        <button
          onClick={onClose}
          style={{
            position: "absolute", top: 14, right: 14, background: "rgba(255,255,255,0.06)",
            border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, width: 30, height: 30,
            color: "#EDEFF7", cursor: "pointer", fontSize: 16, lineHeight: "1"
          }}
        >
          ×
        </button>

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
          <div style={{
            width: 30, height: 30, borderRadius: 8, background: "linear-gradient(135deg,#C6FF3D,#7C4DFF)",
            display: "flex", alignItems: "center", justifyContent: "center"
          }}>
            <User size={15} color="#0B0E1A" />
          </div>
          <span style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 20, color: "#EDEFF7" }}>
            {mode === "login" ? "Нэвтрэх" : "Бүртгүүлэх"}
          </span>
        </div>

        <div style={{
          display: "flex", background: "rgba(255,255,255,0.05)", borderRadius: 12, padding: 4, marginBottom: 20
        }}>
          {["login", "register"].map((m) => (
            <button
              key={m}
              type="button"
              onClick={() => setMode(m)}
              style={{
                flex: 1, padding: "9px 0", borderRadius: 9, border: "none", cursor: "pointer",
                fontSize: 13, fontWeight: 700, fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.3,
                background: mode === m ? "linear-gradient(90deg,#C6FF3D,#8FE62E)" : "transparent",
                color: mode === m ? "#0B0E1A" : "#9BA0B8"
              }}
            >
              {m === "login" ? "Нэвтрэх" : "Бүртгүүлэх"}
            </button>
          ))}
        </div>

        <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {mode === "register" && (
            <div>
              <label style={fieldLabelStyle}>Нэр</label>
              <input
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="Нэрээ оруулна уу"
                style={inputStyle}
              />
            </div>
          )}
          <div>
            <label style={fieldLabelStyle}>Утасны дугаар</label>
            <input
              value={phone}
              onChange={(e) => setPhone(e.target.value)}
              placeholder="99xxxxxx"
              style={inputStyle}
            />
          </div>
          <div>
            <label style={fieldLabelStyle}>Нууц үг</label>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="••••••••"
              style={inputStyle}
            />
          </div>

          <button
            type="submit"
            disabled={!canSubmit}
            style={{
              marginTop: 6, padding: "13px 0", borderRadius: 14, border: "none",
              background: canSubmit ? "linear-gradient(90deg,#C6FF3D,#8FE62E)" : "rgba(255,255,255,0.08)",
              color: canSubmit ? "#0B0E1A" : "#6C7189",
              fontWeight: 800, fontSize: 15, cursor: canSubmit ? "pointer" : "not-allowed",
              fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.5,
              display: "flex", alignItems: "center", justifyContent: "center", gap: 6
            }}
          >
            {mode === "login" ? "Нэвтрэх" : "Бүртгүүлэх"} <ChevronRight size={18} />
          </button>
        </form>
      </div>
    </div>
  );
}

// ---------- App shell ----------
function TopUpZone() {
  const [step, setStep] = useState("home");
  const [game, setGame] = useState(null);
  const [order, setOrder] = useState(null);
  const [user, setUser] = useState(null);
  const [showAuth, setShowAuth] = useState(false);

  const handleBack = () => {
    if (step === "checkout") setStep("game");
    else if (step === "game") { setStep("home"); setGame(null); }
  };

  const handleGoHome = () => {
    setStep("home");
    setGame(null);
    setOrder(null);
  };

  const handleLoginClick = () => {
    if (user) {
      setUser(null);
    } else {
      setShowAuth(true);
    }
  };

  const handleAuthSuccess = (name) => {
    setUser(name);
    setShowAuth(false);
  };

  return (
    <div className="app-shell" style={{
      width: "100%", maxWidth: 900, margin: "0 auto", minHeight: 700,
      background: "#0B0E1A", fontFamily: "'Inter', sans-serif", position: "relative",
      borderRadius: 20, overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.5)"
    }}>
      <Header step={step} onBack={handleBack} user={user} onLoginClick={handleLoginClick} />
      {step === "home" && (
        <HomeScreen onSelectGame={(g) => { setGame(g); setStep("game"); }} />
      )}
      {step === "game" && game && (
        <GameDetailScreen game={game} onCheckout={(o) => { setOrder(o); setStep("checkout"); }} />
      )}
      {step === "checkout" && order && (
        <CheckoutScreen order={order} game={game} onConfirm={() => {}} onGoHome={handleGoHome} />
      )}
      {showAuth && (
        <AuthModal onClose={() => setShowAuth(false)} onSuccess={handleAuthSuccess} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TopUpZone />);
</script>
</body>
</html>
