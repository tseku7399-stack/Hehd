<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TopUpZone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0A0714; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 12px;
    font-family: 'Sora', sans-serif;
    background:
      radial-gradient(circle at 12% -8%, rgba(255,60,126,0.22), transparent 42%),
      radial-gradient(circle at 92% 6%, rgba(41,231,205,0.16), transparent 40%),
      radial-gradient(circle at 50% 110%, rgba(139,124,255,0.14), transparent 45%),
      #0A0714;
  }
  input::placeholder { color: #6B5F94; }
  button { font-family: inherit; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ---------- Icon components (inline SVG, lucide-style) ----------
function makeIcon(paths) {
  return function IconCmp({ size = 18, color = "currentColor", strokeWidth = 2, fill = "none" }) {
    return (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill={fill}
        stroke={color}
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
      >
        {paths}
      </svg>
    );
  };
}

const Zap = makeIcon(<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />);
const Search = makeIcon(<>
  <circle cx="11" cy="11" r="8" />
  <line x1="21" y1="21" x2="16.65" y2="16.65" />
</>);
const User = makeIcon(<>
  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
  <circle cx="12" cy="7" r="4" />
</>);
const ChevronRight = makeIcon(<polyline points="9 18 15 12 9 6" />);
const Check = makeIcon(<polyline points="20 6 9 17 4 12" />);
const Flame = makeIcon(<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />);
const CreditCard = makeIcon(<>
  <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
  <line x1="1" y1="10" x2="23" y2="10" />
</>);
const Wallet = makeIcon(<>
  <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />
  <path d="M3 5v14a2 2 0 0 0 2 2h16v-5" />
  <path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
</>);
const Smartphone = makeIcon(<>
  <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
  <line x1="12" y1="18" x2="12.01" y2="18" />
</>);
const ArrowLeft = makeIcon(<>
  <line x1="19" y1="12" x2="5" y2="12" />
  <polyline points="12 19 5 12 12 5" />
</>);
const TrendingUp = makeIcon(<>
  <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
  <polyline points="17 6 23 6 23 12" />
</>);

// ---------- Design tokens ----------
const PAGE_BG = "#0A0714"; // used to fake ticket "punch holes"
const INK = "#F5F1FF";
const MUTED = "#9C8FC4";
const FAINT = "#6B5F94";
const PANEL = "#161027";
const PANEL_2 = "#1D1732";

// ---------- Mock data (no external images — every game renders identically, no broken-link risk) ----------
const GAMES = [
  { id: "pubg", name: "PUBG Mobile", currency: "UC", icon: "🔫", color: "#29E7CD", banner: "linear-gradient(135deg,#08201C,#0E3B34 55%,#29E7CD)", popular: true, hasZoneId: false },
  { id: "mlbb", name: "Mobile Legends", currency: "Diamond", icon: "⚔️", color: "#FF3C7E", banner: "linear-gradient(135deg,#260A18,#4A1230 55%,#FF3C7E)", popular: true, hasZoneId: true },
  { id: "standoff2", name: "Standoff 2", currency: "Gold", icon: "🔥", color: "#FFB238", banner: "linear-gradient(135deg,#241605,#4A3308 55%,#FFB238)", popular: true, hasZoneId: false },
  { id: "roblox", name: "Roblox", currency: "Robux", icon: "🧱", color: "#8B7CFF", banner: "linear-gradient(135deg,#160F30,#2C1E5C 55%,#8B7CFF)", popular: true, hasZoneId: false },
];

const CURRENCY_EMOJI = {
  pubg: "🎟️",
  mlbb: "💎",
  standoff2: "🪙",
  roblox: "🔷",
};

const PACKAGES = {
  pubg: [
    { id: 1, amount: 60, bonus: 0, price: 5000 },
    { id: 2, amount: 325, bonus: 0, price: 18000, popular: true },
    { id: 3, amount: 660, bonus: 0, price: 35500 },
    { id: 4, amount: 1800, bonus: 0, price: 87000 },
    { id: 5, amount: 3850, bonus: 0, price: 170000 },
    { id: 6, amount: 8100, bonus: 0, price: 340000, best: true },
  ],
  mlbb: [
    { id: 1, amount: 20, bonus: 0, price: 2500 },
    { id: 2, amount: 40, bonus: 0, price: 4000 },
    { id: 3, amount: 60, bonus: 0, price: 6000 },
    { id: 4, amount: 101, bonus: 0, price: 8000 },
    { id: 5, amount: 206, bonus: 0, price: 15000, popular: true },
    { id: 6, amount: 412, bonus: 0, price: 28500 },
    { id: 7, amount: 1049, bonus: 0, price: 65000 },
    { id: 8, amount: 2132, bonus: 0, price: 135000 },
    { id: 9, amount: 4299, bonus: 0, price: 260000 },
    { id: 10, amount: 6502, bonus: 0, price: 375000, best: true },
  ],
};
const defaultPackages = (curr) => [
  { id: 1, amount: 60, bonus: 0, price: 5000 },
  { id: 2, amount: 325, bonus: 25, price: 25000, popular: true },
  { id: 3, amount: 660, bonus: 60, price: 50000 },
  { id: 4, amount: 1800, bonus: 200, price: 130000, best: true },
  { id: 5, amount: 3850, bonus: 480, price: 270000 },
  { id: 6, amount: 8100, bonus: 1100, price: 550000 },
];

const PAYMENT_METHODS = [
  { id: "qpay", name: "QPay", icon: Smartphone, desc: "Банкны апп-аар скан хийж төлөх" },
  { id: "card", name: "Карт", icon: CreditCard, desc: "Visa / Mastercard" },
  { id: "wallet", name: "Хэтэвч", icon: Wallet, desc: "Үлдэгдэл: 0₮" },
];

function fmt(n) {
  return n.toLocaleString("mn-MN") + "₮";
}

// ---------- Reusable: ticket-stub perforation (signature element) ----------
// A dashed seam with two "punched" half-circles cut into the page background,
// styled after a game top-up voucher / arcade ticket stub.
function TicketSeam({ bg = PAGE_BG }) {
  return (
    <div style={{ position: "relative", height: 0 }}>
      <div style={{
        position: "absolute", left: -1, right: -1, top: -9, height: 18,
        display: "flex", alignItems: "center", justifyContent: "space-between"
      }}>
        <div style={{ width: 18, height: 18, borderRadius: "50%", background: bg, marginLeft: -9 }} />
        <div style={{
          flex: 1, height: 0, borderTop: "2px dashed rgba(245,241,255,0.22)", margin: "0 6px"
        }} />
        <div style={{ width: 18, height: 18, borderRadius: "50%", background: bg, marginRight: -9 }} />
      </div>
    </div>
  );
}

// ---------- Header ----------
function Header({ step, onBack, user, onLoginClick }) {
  return (
    <div style={{
      position: "sticky", top: 0, zIndex: 20,
      background: "rgba(13,9,26,0.88)", backdropFilter: "blur(12px)",
      borderBottom: "1px solid rgba(255,60,126,0.18)",
      padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between"
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        {step !== "home" && (
          <button onClick={onBack} style={{
            background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.12)",
            borderRadius: 10, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center",
            color: INK, cursor: "pointer"
          }}>
            <ArrowLeft size={18} />
          </button>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{
            width: 34, height: 34, borderRadius: 9,
            background: "linear-gradient(135deg,#FF3C7E,#FF7A45)",
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 0 18px rgba(255,60,126,0.55)"
          }}>
            <Zap size={18} color="#1A0510" fill="#1A0510" />
          </div>
          <span style={{
            fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 22, letterSpacing: 0.5, color: INK
          }}>
            TOP<span style={{ color: "#FF3C7E" }}>UP</span>ZONE
          </span>
        </div>
      </div>
      <button
        onClick={onLoginClick}
        style={{
          background: "rgba(41,231,205,0.14)", border: "1px solid rgba(41,231,205,0.4)",
          borderRadius: 20, padding: "8px 14px", display: "flex", alignItems: "center", gap: 6,
          color: INK, fontSize: 13, fontWeight: 600, cursor: "pointer"
        }}
      >
        <User size={14} color="#29E7CD" /> {user ? user : "Нэвтрэх"}
      </button>
    </div>
  );
}

// ---------- Home / Game selection ----------
function HomeScreen({ onSelectGame }) {
  const [search, setSearch] = useState("");
  const filtered = GAMES.filter((g) => g.name.toLowerCase().includes(search.toLowerCase()));

  return (
    <div style={{ padding: "24px 20px 60px" }}>
      {/* Hero */}
      <div style={{
        borderRadius: 20, padding: "32px 24px", marginBottom: 28, position: "relative", overflow: "hidden",
        background: "linear-gradient(135deg,#160F2C,#2A1140 55%,#160B22)",
        border: "1px solid rgba(255,60,126,0.22)"
      }}>
        <div style={{
          position: "absolute", top: "-30%", right: "-10%", width: "50%", height: "160%",
          background: "radial-gradient(circle, rgba(255,60,126,0.28), transparent 70%)"
        }} />
        <div style={{
          position: "absolute", bottom: "-40%", left: "-10%", width: "50%", height: "160%",
          background: "radial-gradient(circle, rgba(41,231,205,0.22), transparent 70%)"
        }} />
        <div style={{ position: "relative", zIndex: 1 }}>
          <div style={{
            display: "inline-flex", alignItems: "center", gap: 6, background: "rgba(255,178,56,0.14)",
            border: "1px solid rgba(255,178,56,0.4)", borderRadius: 20, padding: "5px 12px",
            fontSize: 12, fontWeight: 700, color: "#FFB238", marginBottom: 16
          }}>
            <Zap size={12} fill="#FFB238" color="#FFB238" /> Instant цэнэглэлт · 24/7
          </div>
          <h1 style={{
            fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 32, lineHeight: 1.15,
            color: INK, margin: "0 0 10px"
          }}>
            Diamond, UC цэнэглэлт<br /><span style={{
              background: "linear-gradient(90deg,#FF3C7E,#FFB238)", WebkitBackgroundClip: "text",
              WebkitTextFillColor: "transparent", backgroundClip: "text"
            }}>1 минутанд</span>
          </h1>
          <p style={{ color: MUTED, fontSize: 14, margin: 0, maxWidth: 380 }}>
            Тоглоомын ID-гаа оруулаад, багц сонгоод QPay-аар шууд төл. Бэлэн бол дор нь орно.
          </p>
        </div>
      </div>

      {/* Search */}
      <div style={{
        display: "flex", alignItems: "center", gap: 10, background: "rgba(255,255,255,0.05)",
        border: "1px solid rgba(255,255,255,0.12)", borderRadius: 14, padding: "12px 16px", marginBottom: 24
      }}>
        <Search size={18} color={FAINT} />
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="Тоглоом хайх..."
          style={{
            background: "none", border: "none", outline: "none", color: INK, fontSize: 14, width: "100%",
            fontFamily: "inherit"
          }}
        />
      </div>

      {/* Popular label */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
        <Flame size={16} color="#FF7A45" />
        <span style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 16, color: INK, letterSpacing: 0.5 }}>
          ОНЦЛОХ ТОГЛООМУУД
        </span>
      </div>

      {/* Game grid */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 14 }}>
        {filtered.map((g) => (
          <GameCard key={g.id} game={g} onClick={() => onSelectGame(g)} />
        ))}
      </div>
    </div>
  );
}

function GameCard({ game, onClick }) {
  const [hover, setHover] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        borderRadius: 16, cursor: "pointer", position: "relative",
        border: `1px solid ${hover ? game.color : "rgba(255,255,255,0.08)"}`,
        transition: "all 0.2s ease", transform: hover ? "translateY(-4px)" : "translateY(0)",
        boxShadow: hover ? `0 14px 32px ${game.color}40` : "none",
        background: PANEL, overflow: "visible"
      }}
    >
      <div style={{
        height: 96, background: game.banner, display: "flex", alignItems: "center", justifyContent: "center",
        position: "relative", borderRadius: "16px 16px 0 0", overflow: "hidden"
      }}>
        {game.popular && (
          <span style={{
            position: "absolute", top: 8, left: 8, background: "rgba(10,7,20,0.55)",
            color: "#fff", fontSize: 9, fontWeight: 700, padding: "3px 7px", borderRadius: 8,
            display: "flex", alignItems: "center", gap: 3
          }}>
            <TrendingUp size={9} /> ТРЕНД
          </span>
        )}
        <div style={{
          width: 56, height: 56, borderRadius: 14, background: "rgba(10,7,20,0.35)",
          border: "1px solid rgba(255,255,255,0.35)", display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 28, boxShadow: `0 0 22px ${game.color}55`, backdropFilter: "blur(2px)"
        }}>
          {game.icon}
        </div>
      </div>
      <TicketSeam bg={PANEL} />
      <div style={{ padding: "14px 12px 12px", borderRadius: "0 0 16px 16px" }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: INK, marginBottom: 2 }}>{game.name}</div>
        <div style={{ fontSize: 11, color: game.color, fontWeight: 600 }}>{CURRENCY_EMOJI[game.id] || "💠"} {game.currency} цэнэглэлт</div>
      </div>
    </div>
  );
}

// ---------- Player ID + Package screen ----------
function GameDetailScreen({ game, onCheckout }) {
  const [playerId, setPlayerId] = useState("");
  const [serverId, setServerId] = useState("");
  const [selectedPkg, setSelectedPkg] = useState(null);
  const [checking, setChecking] = useState(false);
  const [checkedName, setCheckedName] = useState(null);
  const packages = PACKAGES[game.id] || defaultPackages(game.currency);

  const idReady = playerId.trim() && (!game.hasZoneId || serverId.trim());

  const handleIdChange = (setter) => (e) => {
    setter(e.target.value);
    setCheckedName(null);
  };

  const handleCheck = () => {
    if (!idReady || checking) return;
    setChecking(true);
    setCheckedName(null);
    setTimeout(() => {
      setChecking(false);
      setCheckedName(`Player_${playerId.trim().slice(-5)}`);
    }, 800);
  };

  const canBuy = selectedPkg && idReady && checkedName;

  return (
    <div style={{ padding: "20px 20px 100px" }}>
      <div style={{
        borderRadius: 18, marginBottom: 22, background: game.banner,
        minHeight: 128, display: "flex", alignItems: "center", padding: "0 22px", position: "relative", overflow: "hidden"
      }}>
        <div style={{
          position: "absolute", top: "-40%", right: "-15%", width: "60%", height: "180%",
          background: "radial-gradient(circle, rgba(255,255,255,0.16), transparent 70%)"
        }} />
        <div style={{
          width: 80, height: 80, borderRadius: 18, background: "rgba(10,7,20,0.32)",
          border: "1px solid rgba(255,255,255,0.4)", display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 40, marginRight: 18, boxShadow: `0 0 30px ${game.color}66`, position: "relative", zIndex: 1,
          animation: "floaty 3.2s ease-in-out infinite"
        }}>
          {game.icon}
        </div>
        <div style={{ position: "relative", zIndex: 1 }}>
          <div style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 24, color: "#fff" }}>{game.name}</div>
          <div style={{ fontSize: 13, color: "rgba(255,255,255,0.9)", display: "flex", alignItems: "center", gap: 6, marginTop: 2 }}>
            {CURRENCY_EMOJI[game.id] || "💠"} {game.currency} шууд цэнэглэлт
          </div>
        </div>
      </div>

      {/* Player ID */}
      <SectionLabel step="1" text="Тоглогчийн ID оруулах" />
      <div style={{ display: "flex", flexWrap: "nowrap", gap: 10, marginBottom: 12 }}>
        <div style={{ flex: "1 1 0", minWidth: 0 }}>
          <label style={fieldLabelStyle}>ID оруулах</label>
          <input
            value={playerId}
            onChange={handleIdChange(setPlayerId)}
            placeholder="Жишээ: 123456789"
            style={inputStyle}
          />
        </div>
        {game.hasZoneId && (
          <div style={{ flex: "1 1 0", minWidth: 0 }}>
            <label style={fieldLabelStyle}>Zone ID оруулах</label>
            <input
              value={serverId}
              onChange={handleIdChange(setServerId)}
              placeholder="Жишээ: 2001"
              style={inputStyle}
            />
          </div>
        )}
      </div>

      <button
        onClick={handleCheck}
        disabled={!idReady || checking}
        style={{
          width: "100%", padding: "11px 0", borderRadius: 12, marginBottom: 10,
          border: `1px solid ${idReady ? "rgba(41,231,205,0.45)" : "rgba(255,255,255,0.1)"}`,
          background: idReady ? "rgba(41,231,205,0.12)" : "rgba(255,255,255,0.04)",
          color: idReady ? "#29E7CD" : FAINT,
          fontWeight: 700, fontSize: 13.5, cursor: idReady && !checking ? "pointer" : "not-allowed",
          fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.3,
          display: "flex", alignItems: "center", justifyContent: "center", gap: 6
        }}
      >
        {checking ? "Шалгаж байна..." : "ID шалгах"}
      </button>

      {/* Fixed-height reveal zone: clicking "ID шалгах" never resizes the page — the
          confirmation box always occupies the same space, just fades content in/out. */}
      <div style={{
        height: 48, marginBottom: 24, display: "flex", alignItems: "center", gap: 10,
        background: checkedName ? "rgba(41,231,205,0.08)" : "transparent",
        border: checkedName ? "1px solid rgba(41,231,205,0.3)" : "1px solid transparent",
        borderRadius: 12, padding: "0 14px", transition: "background 0.15s ease, border-color 0.15s ease"
      }}>
        <div style={{
          width: 22, height: 22, borderRadius: "50%", background: "#29E7CD", flexShrink: 0,
          display: "flex", alignItems: "center", justifyContent: "center",
          opacity: checkedName ? 1 : 0, transition: "opacity 0.15s ease"
        }}>
          <Check size={13} color="#0A0714" strokeWidth={3} />
        </div>
        <span style={{ fontSize: 13, color: INK, opacity: checkedName ? 1 : 0, transition: "opacity 0.15s ease" }}>
          Тоглогч олдлоо: <b>{checkedName || "—"}</b>
        </span>
      </div>

      {/* Packages */}
      <SectionLabel step="2" text={`${game.currency} багц сонгох`} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 28 }}>
        {packages.map((p) => (
          <PackageCard
            key={p.id}
            pkg={p}
            currency={game.currency}
            color={game.color}
            emoji={CURRENCY_EMOJI[game.id] || "💠"}
            selected={selectedPkg?.id === p.id}
            onClick={() => setSelectedPkg(p)}
          />
        ))}
      </div>

      {/* Sticky checkout bar */}
      <div style={{
        position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 20,
        background: "rgba(13,9,26,0.95)", backdropFilter: "blur(12px)",
        borderTop: "1px solid rgba(255,255,255,0.08)", padding: "14px 20px",
        display: "flex", alignItems: "center", justifyContent: "space-between", maxWidth: 900, margin: "0 auto"
      }}>
        <div>
          <div style={{ fontSize: 11, color: FAINT }}>Нийт төлөх</div>
          <div style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 20, color: selectedPkg ? "#FF3C7E" : FAINT }}>
            {selectedPkg ? fmt(selectedPkg.price) : "—"}
          </div>
        </div>
        <button
          disabled={!canBuy}
          onClick={() => onCheckout({ playerId, serverId, pkg: selectedPkg })}
          style={{
            padding: "13px 32px", borderRadius: 14, border: "none",
            background: canBuy ? "linear-gradient(90deg,#FF3C7E,#FF7A45)" : "rgba(255,255,255,0.08)",
            color: canBuy ? "#fff" : FAINT,
            fontWeight: 800, fontSize: 15, cursor: canBuy ? "pointer" : "not-allowed",
            fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.5,
            display: "flex", alignItems: "center", gap: 6,
            boxShadow: canBuy ? "0 8px 24px rgba(255,60,126,0.35)" : "none"
          }}
        >
          Худалдан авах <ChevronRight size={18} />
        </button>
      </div>
    </div>
  );
}

function SectionLabel({ step, text }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
      <div style={{
        width: 24, height: 24, borderRadius: "50%", background: "rgba(255,60,126,0.16)",
        border: "1px solid #FF3C7E", color: "#FF3C7E", fontSize: 12, fontWeight: 800,
        display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Rajdhani', sans-serif"
      }}>
        {step}
      </div>
      <span style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 16, color: INK, letterSpacing: 0.3 }}>
        {text}
      </span>
    </div>
  );
}

const inputStyle = {
  flex: 1, background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.14)",
  borderRadius: 12, padding: "13px 16px", color: INK, fontSize: 14, outline: "none",
  fontFamily: "inherit", boxSizing: "border-box", width: "100%"
};

const fieldLabelStyle = {
  display: "block", fontSize: 12.5, color: MUTED, marginBottom: 6,
  whiteSpace: "nowrap", overflow: "visible"
};

function PackageCard({ pkg, currency, color, emoji, selected, onClick }) {
  return (
    <div
      onClick={onClick}
      style={{
        borderRadius: 14, padding: "14px 14px 12px", cursor: "pointer", position: "relative",
        background: selected ? `${color}1F` : "rgba(255,255,255,0.04)",
        border: selected ? `1.5px solid ${color}` : "1px solid rgba(255,255,255,0.1)",
        transition: "all 0.15s ease"
      }}
    >
      {(pkg.popular || pkg.best) && (
        <span style={{
          position: "absolute", top: -9, right: 10, fontSize: 9, fontWeight: 800,
          padding: "3px 8px", borderRadius: 8, letterSpacing: 0.3,
          background: pkg.best ? "linear-gradient(90deg,#FFB238,#FF7A1F)" : "linear-gradient(90deg,#29E7CD,#4DEBFF)",
          color: "#0A0714"
        }}>
          {pkg.best ? "ХЯМД" : "ТҮГЭЭМЭЛ"}
        </span>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
        <span style={{ fontSize: 15 }}>{emoji}</span>
        <span style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 17, color: INK }}>
          {pkg.amount.toLocaleString()}
        </span>
        {pkg.bonus > 0 && (
          <span style={{ fontSize: 10, color: "#29E7CD", fontWeight: 700 }}>+{pkg.bonus}</span>
        )}
      </div>
      <div style={{ fontSize: 12, color: FAINT, marginBottom: 8 }}>{currency}</div>
      <div style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 15, color: selected ? color : INK }}>
        {fmt(pkg.price)}
      </div>
      {selected && (
        <div style={{
          position: "absolute", top: 10, right: 10, width: 18, height: 18, borderRadius: "50%",
          background: color, display: "flex", alignItems: "center", justifyContent: "center"
        }}>
          <Check size={11} color="#0A0714" strokeWidth={3} />
        </div>
      )}
    </div>
  );
}

// ---------- Checkout screen ----------
function CheckoutScreen({ order, game, onConfirm, onGoHome }) {
  const [method, setMethod] = useState("qpay");
  const [paid, setPaid] = useState(false);

  if (paid) {
    return (
      <div style={{ padding: "60px 24px", textAlign: "center" }}>
        <div style={{
          width: 84, height: 84, borderRadius: "50%", background: "rgba(41,231,205,0.15)",
          border: "2px solid #29E7CD", display: "flex", alignItems: "center", justifyContent: "center",
          margin: "0 auto 24px", boxShadow: "0 0 30px rgba(41,231,205,0.35)"
        }}>
          <Check size={40} color="#29E7CD" strokeWidth={3} />
        </div>
        <h2 style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 26, color: INK, margin: "0 0 10px" }}>
          Амжилттай цэнэглэгдлээ!
        </h2>
        <p style={{ color: MUTED, fontSize: 14, margin: "0 0 4px" }}>
          {order.pkg.amount.toLocaleString()} {game.currency} таны {game.name} акаунт руу орлоо.
        </p>
        <p style={{ color: FAINT, fontSize: 12, marginBottom: 28 }}>ID: {order.playerId} {order.serverId && `· Server: ${order.serverId}`}</p>
        <button
          onClick={onGoHome}
          style={{
            padding: "13px 32px", borderRadius: 14, border: "none",
            background: "linear-gradient(90deg,#FF3C7E,#FF7A45)", color: "#fff",
            fontWeight: 800, fontSize: 15, cursor: "pointer",
            fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.5,
            display: "inline-flex", alignItems: "center", gap: 6,
            boxShadow: "0 8px 24px rgba(255,60,126,0.35)"
          }}
        >
          Нүүр хуудас руу буцах <ChevronRight size={18} />
        </button>
      </div>
    );
  }

  return (
    <div style={{ padding: "20px 20px 100px" }}>
      <SectionLabel step="3" text="Захиалгын мэдээлэл" />
      <div style={{
        background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)",
        borderRadius: 14, padding: 16, marginBottom: 24
      }}>
        <Row label="Тоглоом" value={game.name} />
        <Row label="Player ID" value={order.playerId} />
        {order.serverId && <Row label="Server ID" value={order.serverId} />}
        <Row label="Багц" value={`${order.pkg.amount.toLocaleString()} ${game.currency}${order.pkg.bonus ? ` (+${order.pkg.bonus} бонус)` : ""}`} />
        <div style={{ borderTop: "1px solid rgba(255,255,255,0.1)", margin: "10px 0", paddingTop: 10 }}>
          <Row label="Нийт дүн" value={fmt(order.pkg.price)} big />
        </div>
      </div>

      <SectionLabel step="4" text="Төлбөрийн хэлбэр" />
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
        {PAYMENT_METHODS.map((m) => (
          <div
            key={m.id}
            onClick={() => setMethod(m.id)}
            style={{
              display: "flex", alignItems: "center", gap: 14, padding: "14px 16px", borderRadius: 14,
              cursor: "pointer", background: method === m.id ? "rgba(41,231,205,0.12)" : "rgba(255,255,255,0.04)",
              border: method === m.id ? "1.5px solid #29E7CD" : "1px solid rgba(255,255,255,0.1)"
            }}
          >
            <div style={{
              width: 40, height: 40, borderRadius: 10, background: "rgba(255,255,255,0.06)",
              display: "flex", alignItems: "center", justifyContent: "center"
            }}>
              <m.icon size={18} color={INK} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: INK }}>{m.name}</div>
              <div style={{ fontSize: 11, color: FAINT }}>{m.desc}</div>
            </div>
            {method === m.id && (
              <div style={{
                width: 18, height: 18, borderRadius: "50%", background: "#29E7CD",
                display: "flex", alignItems: "center", justifyContent: "center"
              }}>
                <Check size={11} color="#0A0714" strokeWidth={3} />
              </div>
            )}
          </div>
        ))}
      </div>

      <div style={{
        position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 20,
        background: "rgba(13,9,26,0.95)", backdropFilter: "blur(12px)",
        borderTop: "1px solid rgba(255,255,255,0.08)", padding: "14px 20px", maxWidth: 900, margin: "0 auto"
      }}>
        <button
          onClick={() => setPaid(true)}
          style={{
            width: "100%", padding: "15px 0", borderRadius: 14, border: "none",
            background: "linear-gradient(90deg,#FF3C7E,#FF7A45)", color: "#fff",
            fontWeight: 800, fontSize: 16, cursor: "pointer", fontFamily: "'Rajdhani', sans-serif",
            letterSpacing: 0.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            boxShadow: "0 8px 24px rgba(255,60,126,0.35)"
          }}
        >
          <Zap size={18} color="#fff" fill="#fff" /> {fmt(order.pkg.price)} төлөх
        </button>
      </div>
    </div>
  );
}

function Row({ label, value, big }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "5px 0" }}>
      <span style={{ fontSize: big ? 14 : 13, color: big ? INK : MUTED, fontWeight: big ? 700 : 400 }}>{label}</span>
      <span style={{
        fontSize: big ? 18 : 13, color: big ? "#FF3C7E" : INK, fontWeight: big ? 800 : 600,
        fontFamily: big ? "'Rajdhani', sans-serif" : "inherit"
      }}>
        {value}
      </span>
    </div>
  );
}

// ---------- Auth modal ----------
function AuthModal({ onClose, onSuccess }) {
  const [mode, setMode] = useState("login"); // "login" | "register"
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [password, setPassword] = useState("");

  const canSubmit = mode === "login" ? phone.trim() && password.trim() : name.trim() && phone.trim() && password.trim();

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!canSubmit) return;
    onSuccess(mode === "login" ? phone.trim() : name.trim());
  };

  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, zIndex: 50, background: "rgba(6,4,14,0.72)",
        backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center",
        padding: 20
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          width: "100%", maxWidth: 380, background: PANEL_2, borderRadius: 20,
          border: "1px solid rgba(255,255,255,0.12)", padding: 26, position: "relative",
          boxShadow: "0 20px 60px rgba(0,0,0,0.55)"
        }}
      >
        <button
          onClick={onClose}
          style={{
            position: "absolute", top: 14, right: 14, background: "rgba(255,255,255,0.06)",
            border: "1px solid rgba(255,255,255,0.12)", borderRadius: 10, width: 30, height: 30,
            color: INK, cursor: "pointer", fontSize: 16, lineHeight: "1"
          }}
        >
          ×
        </button>

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
          <div style={{
            width: 30, height: 30, borderRadius: 8, background: "linear-gradient(135deg,#FF3C7E,#FF7A45)",
            display: "flex", alignItems: "center", justifyContent: "center"
          }}>
            <User size={15} color="#1A0510" />
          </div>
          <span style={{ fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, fontSize: 20, color: INK }}>
            {mode === "login" ? "Нэвтрэх" : "Бүртгүүлэх"}
          </span>
        </div>

        <div style={{
          display: "flex", background: "rgba(255,255,255,0.05)", borderRadius: 12, padding: 4, marginBottom: 20
        }}>
          {["login", "register"].map((m) => (
            <button
              key={m}
              type="button"
              onClick={() => setMode(m)}
              style={{
                flex: 1, padding: "9px 0", borderRadius: 9, border: "none", cursor: "pointer",
                fontSize: 13, fontWeight: 700, fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.3,
                background: mode === m ? "linear-gradient(90deg,#FF3C7E,#FF7A45)" : "transparent",
                color: mode === m ? "#fff" : MUTED
              }}
            >
              {m === "login" ? "Нэвтрэх" : "Бүртгүүлэх"}
            </button>
          ))}
        </div>

        <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {mode === "register" && (
            <div>
              <label style={fieldLabelStyle}>Нэр</label>
              <input
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="Нэрээ оруулна уу"
                style={inputStyle}
              />
            </div>
          )}
          <div>
            <label style={fieldLabelStyle}>Утасны дугаар</label>
            <input
              value={phone}
              onChange={(e) => setPhone(e.target.value)}
              placeholder="99xxxxxx"
              style={inputStyle}
            />
          </div>
          <div>
            <label style={fieldLabelStyle}>Нууц үг</label>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="••••••••"
              style={inputStyle}
            />
          </div>

          <button
            type="submit"
            disabled={!canSubmit}
            style={{
              marginTop: 6, padding: "13px 0", borderRadius: 14, border: "none",
              background: canSubmit ? "linear-gradient(90deg,#FF3C7E,#FF7A45)" : "rgba(255,255,255,0.08)",
              color: canSubmit ? "#fff" : FAINT,
              fontWeight: 800, fontSize: 15, cursor: canSubmit ? "pointer" : "not-allowed",
              fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.5,
              display: "flex", alignItems: "center", justifyContent: "center", gap: 6
            }}
          >
            {mode === "login" ? "Нэвтрэх" : "Бүртгүүлэх"} <ChevronRight size={18} />
          </button>
        </form>
      </div>
    </div>
  );
}

// ---------- App shell ----------
function TopUpZone() {
  const [step, setStep] = useState("home");
  const [game, setGame] = useState(null);
  const [order, setOrder] = useState(null);
  const [user, setUser] = useState(null);
  const [showAuth, setShowAuth] = useState(false);

  const handleBack = () => {
    if (step === "checkout") setStep("game");
    else if (step === "game") { setStep("home"); setGame(null); }
  };

  const handleGoHome = () => {
    setStep("home");
    setGame(null);
    setOrder(null);
  };

  const handleLoginClick = () => {
    if (user) {
      setUser(null);
    } else {
      setShowAuth(true);
    }
  };

  const handleAuthSuccess = (name) => {
    setUser(name);
    setShowAuth(false);
  };

  return (
    <div style={{
      width: "100%", maxWidth: 900, margin: "0 auto", minHeight: 700,
      background: "#0D0918", fontFamily: "'Sora', sans-serif", position: "relative",
      borderRadius: 20, overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.55)",
      border: "1px solid rgba(255,255,255,0.06)"
    }}>
      <Header step={step} onBack={handleBack} user={user} onLoginClick={handleLoginClick} />
      {step === "home" && (
        <HomeScreen onSelectGame={(g) => { setGame(g); setStep("game"); }} />
      )}
      {step === "game" && game && (
        <GameDetailScreen game={game} onCheckout={(o) => { setOrder(o); setStep("checkout"); }} />
      )}
      {step === "checkout" && order && (
        <CheckoutScreen order={order} game={game} onConfirm={() => {}} onGoHome={handleGoHome} />
      )}
      {showAuth && (
        <AuthModal onClose={() => setShowAuth(false)} onSuccess={handleAuthSuccess} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TopUpZone />);
</script>
</body>
</html>
